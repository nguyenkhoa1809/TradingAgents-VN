name: MarketWire Daily

on:
  schedule:
    # 1:15 UTC + 7h = 8:15 ICT cùng ngày (không lệch ngày UTC/ICT) -> 1-6 UTC = thứ 2-7 ICT, đúng.
    - cron: '15 1 * * 1-6'  # 08:15 ICT (UTC+7) thứ 2 đến thứ 7
  workflow_dispatch:          # trigger thủ công

# Pipeline download DB từ R2 -> sửa -> upload lại — 2 run chồng nhau sẽ đè mất
# data của nhau (run nào upload sau thắng, không lỗi gì để thấy). Xếp hàng thay
# vì hủy, để không mất lần chạy dữ liệu ngày hôm đó.
concurrency:
  group: marketwire-daily
  cancel-in-progress: false

jobs:
  # Nguồn bên ngoài đang tự bắn workflow_dispatch ~8:00 ICT hàng ngày (token
  # fine-grained "marketwire-dispatch-trigger", cron-job.org). Schedule 08:15
  # ICT thường bị GitHub delay tới 11h-12h. Gate này để schedule chỉ chạy thật
  # khi CHƯA có workflow_dispatch nào thành công trong ngày — tránh chạy
  # trùng/tốn API 2 lần lúc 12h khi 8h đã xong, nhưng vẫn là backup nếu nguồn
  # 8h đó hỏng.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      already_ran_today: ${{ steps.check.outputs.already_ran_today }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TODAY_ICT=$(TZ=Asia/Ho_Chi_Minh date +%F)
          LAST_SUCCESS=$(gh run list --workflow=marketwire_daily.yml --event=workflow_dispatch \
            --status=success --limit=1 --json createdAt --jq '.[0].createdAt // ""')
          LAST_SUCCESS_ICT=""
          if [ -n "$LAST_SUCCESS" ]; then
            LAST_SUCCESS_ICT=$(TZ=Asia/Ho_Chi_Minh date -d "$LAST_SUCCESS" +%F)
          fi
          if [ "$LAST_SUCCESS_ICT" = "$TODAY_ICT" ]; then
            echo "already_ran_today=true" >> "$GITHUB_OUTPUT"
            echo "Đã có workflow_dispatch thành công hôm nay ($TODAY_ICT) — bỏ qua lần schedule này."
          else
            echo "already_ran_today=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: [gate]
    if: always() && !failure() && !cancelled() && needs.gate.outputs.already_ran_today != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          # requirements.txt nằm trong marketwire/, không phải repo root —
          # chỉ định rõ để cache key tính đúng.
          cache-dependency-path: marketwire/requirements.txt

      - name: Install dependencies
        working-directory: marketwire
        run: pip install -r requirements.txt

      - name: Download DB from R2
        working-directory: marketwire
        run: python scripts/db_sync.py download
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Download wavy signals from R2
        working-directory: marketwire
        continue-on-error: true  # non-critical — thiếu wavy signals không được chặn pipeline
        run: python scripts/wavy_sync.py download
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Download briefing archive from R2
        # web/dist/ không persist giữa các lần chạy (checkout mới mỗi lần) —
        # thiếu bước này thì daily-briefing/ chỉ còn đúng 1 ngày (hôm nay),
        # các ngày cũ bị Cloudflare Pages deploy đè mất.
        working-directory: marketwire
        continue-on-error: true  # non-critical — thiếu archive cũ không được chặn pipeline
        run: python scripts/archive_sync.py download
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Install Playwright browsers
        # crawl4ai (requirements.txt) cần Chromium thật cho các nguồn kind: scrape
        # (vd SBV — không có RSS, phải scrape trang JS-rendered). pip install chỉ
        # cài package Python, không tự tải browser binary — thiếu bước này thì
        # mọi nguồn scrape sẽ fail trên runner sạch (ubuntu-latest không có sẵn).
        working-directory: marketwire
        run: python -m playwright install chromium --with-deps

      - name: Run MarketWire pipeline
        working-directory: marketwire
        run: python scripts/run_daily.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload DB to R2
        if: always()  # upload kể cả khi pipeline partial fail — không mất data đã fetch
        working-directory: marketwire
        run: python scripts/db_sync.py upload
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Upload briefing archive to R2
        if: always()  # lưu lại archive kể cả khi pipeline partial fail
        working-directory: marketwire
        continue-on-error: true
        run: python scripts/archive_sync.py upload
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Deploy web to Cloudflare Pages
        if: success()  # chỉ deploy khi KHÔNG có step nào trước đó fail (vd migrate.py — bước critical duy nhất)
        working-directory: marketwire
        # --branch=main bắt buộc: actions/checkout@v4 để repo ở detached HEAD
        # (không có branch local), nên wrangler không tự nhận diện được đây là
        # nhánh production — thiếu flag này, deployment tạo ra preview URL
        # riêng (đúng nội dung) nhưng KHÔNG cập nhật alias marketwire-129.pages.dev.
        run: npx wrangler pages deploy web/dist --project-name=marketwire --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # token chỉ scope Pages:Edit nên wrangler không tự list được account —
          # phải truyền thẳng account_id, dùng chung R2_ACCOUNT_ID (cùng 1 Cloudflare account)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

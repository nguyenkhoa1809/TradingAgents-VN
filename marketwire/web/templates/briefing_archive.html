{% extends "base.html" %}
{% block content %}
<h2 style="margin-top:0">🗂 Lịch sử Briefing</h2>
<p style="color:var(--muted);font-size:13px">{{ dates|length }} ngày</p>

{% for d in dates %}
<article class="article">
  <h2 style="font-size:15px"><a href="{{ d }}.html">🌅 Briefing {{ d }}</a></h2>
</article>
{% endfor %}
{% endblock %}
